<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>Bac Bo Signal</title></head><body><main><header><h1>BAC BO</h1><button id="install" hidden>Instalar</button></header><p>Análise estatística</p><section class="signal"><small>SINAL ATUAL</small><strong id="signal">AGUARDAR</strong><span id="msg">Registe resultados</span></section><div class="buttons"><button data-v="P" class="p">P</button><button data-v="B" class="b">B</button><button data-v="E" class="e">E</button></div><div class="stats"><div><b id="total">0</b><small>Total</small></div><div><b id="pc">0%</b><small>Player</small></div><div><b id="bc">0%</b><small>Banker</small></div><div><b id="ec">0%</b><small>Empate</small></div></div><div class="row"><h2>Histórico</h2><button id="undo">Desfazer</button><button id="clear">Limpar</button></div><div id="history" class="history"></div><p class="warning">⚠️ O sinal é estatístico. Bac Bo é aleatório e nenhum sinal garante vitória.</p></main><script src="app.js"></script></body></html>
